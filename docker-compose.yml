version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: shtp-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./logs/mosquitto:/mosquitto/log
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-t", "healthcheck", "-m", "1", "-u", "${MQTT_NODERED_USER}", "-P", "${MQTT_NODERED_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shtp-net

  postgres:
    image: postgres:15-alpine
    container_name: shtp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - shtp-net

  nodered:
    image: nodered/node-red:latest-20
    container_name: shtp-nodered
    environment:
      TZ: ${TZ}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      GRAFANA_URL: ${GRAFANA_URL}
    ports:
      - "1880:1880"
    volumes:
      - ./nodered:/data
      - ./logs/nodered:/data/logs
      - ./media:/media
    depends_on:
      mosquitto:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:1880/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shtp-net

  grafana:
    image: grafana/grafana:10.4.0
    container_name: shtp-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      # Mac dinh Grafana loc sach (sanitize) HTML trong panel Text, xoa
      # mat the <img> - can bat co nay de panel "Live Camera View" (MJPEG)
      # trong traffic_overview.json hien thi duoc.
      GF_PANELS_DISABLE_SANITIZE_HTML: "true"
      # Grafana's built-in default (5s) would silently clamp the 3s refresh
      # set on each dashboard - lower the floor so that actually takes effect.
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 2s
      TZ: ${TZ}
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards_data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - shtp-net

  mediamtx:
    image: bluenviron/mediamtx:1.6.0
    container_name: shtp-mediamtx
    ports:
      - "8554:8554"       # RTSP
      - "1935:1935"       # RTMP
      - "8888:8888"       # HLS
      - "8889:8889"       # WebRTC HTTP
      - "8890:8890/udp"   # WebRTC UDP
      - "9997:9997"       # API
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml
    restart: unless-stopped
    networks:
      - shtp-net

  mqttx-web:
    image: emqx/mqttx-web:latest
    container_name: shtp-mqttx-web
    ports:
      - "8080:80"
    restart: unless-stopped
    networks:
      - shtp-net

volumes:
  postgres-data:
  grafana-data:

networks:
  shtp-net:
    driver: bridge
